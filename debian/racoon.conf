#
# /etc/racoon/racoon.conf - starter configuration
#
# -----------------------------------------------------------------------
# Connecting to a VPN as a roadwarrior client (the common case)
# -----------------------------------------------------------------------
# If someone else administers the VPN gateway you're connecting to (a
# company or university VPN, for example), you normally do NOT write a
# racoon.conf from scratch. Your VPN administrator issues you:
#
#   - a client certificate and private key (often via an internal
#     certificate-management/self-service page - ask your IT department
#     if you don't know where to get yours)
#   - the CA certificate used to verify the gateway
#   - the gateway's address and any connection-specific instructions
#
# With those in hand, start from the roadwarrior client template instead
# of this file:
#
#   cp /usr/share/racoon/templates/roadwarrior/client/racoon.conf \
#       /etc/racoon/racoon.conf
#
# That template is a complete, commented roadwarrior configuration
# (X.509 + XAuth, Mode Config address/DNS assignment, split routing) and
# is kept up to date with current NetworkManager/systemd-resolved
# integration quirks - read it top to bottom before editing. Its "remote"
# block ships commented out, so racoon starts and idles safely (no
# certificates required yet) the moment you install it - fill in your
# certificate, key, and CA certificate under /etc/racoon/certs (see
# README.Debian for exact permissions), edit the gateway address,
# xauth_login, and proposal your administrator specifies, then uncomment
# the whole "remote" block. Its "path script" already points at
# /etc/racoon/scripts, where this package installs the real split-DNS
# and routing hooks (phase1-up.sh/phase1-down.sh) unconditionally -
# nothing to copy for those, they're already in place.
#
# Running the VPN gateway side instead? Start from
# /usr/share/racoon/templates/roadwarrior/server/racoon.conf, which
# documents pool/Mode Config/split-DNS setup for the server role.
#
# Unlike the rest of this reference material, these templates are
# installed under /usr/share/racoon/ rather than /usr/share/doc/racoon/,
# specifically so they are still there if you have configured dpkg to
# strip /usr/share/doc/* on this system (common on minimal/container
# base images) -- everything below this line is not guaranteed to be.
#
# -----------------------------------------------------------------------
# Reference
# -----------------------------------------------------------------------
#   racoon.conf(5), racoon(8), setkey(8)
#   /usr/share/doc/racoon/README.Debian - certificate setup, permissions,
#     kernel module requirements
#   /usr/share/doc/racoon/examples/ - every narrower single-feature
#     sample shipped with the source, including the legacy PSK/
#     site-to-site samples
#
log notify;
path pre_shared_key "/etc/racoon/psk.txt";
path certificate "/etc/racoon/certs";

# Required whenever privsep {} is active (below) -- points at the real,
# maintained split-DNS/routing hooks this package installs
# unconditionally to /etc/racoon/scripts (see README.Debian), independent
# of whether any "remote" block ends up referencing them by name.
path script "/etc/racoon/scripts";

# Privilege separation active by default: this package's postinst always
# creates the "racoon" system user/group and the root:racoon ownership
# privsep needs on /etc/racoon and /etc/racoon/certs (README.Debian,
# racoon-admin-guide.html Sec 8.5), so nothing here is deferred to a
# manual setup step the way it is for a from-source install. Drops root
# privileges in the negotiation process after startup, keeping only a
# small privileged helper (private key/PSK access, script execution)
# running as root.
privsep {
    user "racoon";
    group "racoon";
}
