#
# /etc/racoon/racoon.conf - starter configuration
#
# -----------------------------------------------------------------------
# Connecting to a VPN as a roadwarrior client (the common case)
# -----------------------------------------------------------------------
# If someone else administers the VPN gateway you're connecting to (a
# company or university VPN, for example), you normally do NOT write a
# racoon.conf from scratch. Your VPN administrator issues you:
#
#   - a client certificate and private key (often via an internal
#     certificate-management/self-service page - ask your IT department
#     if you don't know where to get yours)
#   - the CA certificate used to verify the gateway
#   - the gateway's address and any connection-specific instructions
#
# With those in hand, start from the roadwarrior client example instead
# of this file:
#
#   cp /usr/share/doc/racoon/examples/roadwarrior/client/racoon.conf \
#       /etc/racoon/racoon.conf
#   cp /usr/share/doc/racoon/examples/roadwarrior/client/phase1-up.sh \
#       /usr/share/doc/racoon/examples/roadwarrior/client/phase1-down.sh \
#       /etc/racoon/
#
# That example is a complete, commented roadwarrior configuration
# (X.509 + XAuth, Mode Config address/DNS assignment, split routing) and
# is kept up to date with current NetworkManager/systemd-resolved
# integration quirks - read it top to bottom before editing. Its "remote"
# block ships commented out, so racoon starts and idles safely (no
# certificates required yet) the moment you install it - fill in your
# certificate, key, and CA certificate under /etc/racoon/certs (see
# README.Debian for exact permissions), edit the gateway address,
# xauth_login, and proposal your administrator specifies, then uncomment
# the whole "remote" block.
#
# Running the VPN gateway side instead? Start from
# /usr/share/doc/racoon/examples/roadwarrior/server/racoon.conf, which
# documents pool/Mode Config/split-DNS setup for the server role.
#
# -----------------------------------------------------------------------
# Reference
# -----------------------------------------------------------------------
#   racoon.conf(5), racoon(8), setkey(8)
#   /usr/share/doc/racoon/README.Debian - certificate setup, permissions,
#     kernel module requirements
#   /usr/share/doc/racoon/examples/ - every example shipped with the
#     source, including the legacy PSK/site-to-site samples
#
log notify;
path pre_shared_key "/etc/racoon/psk.txt";
path certificate "/etc/racoon/certs";
