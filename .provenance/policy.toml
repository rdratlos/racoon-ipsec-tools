# AI provenance policy -- RFC 0005 ("provpaws").
# Read by tools/prov.py. Changes to this file are policy changes: review them
# like code, and say why in the commit message.

schema_version = "1.0"

[enforcement]
# Commits reachable from this commit are exempt from trailer rules (they
# predate the policy). prov query still sees them via legacy-map.toml.
# Phase 0 set this to 2813d18 (develop's tip when Phase 0 landed). Phase 1
# moves it to b509568 (prov attest): the three Phase 0 commits after 2813d18
# were signed off and reviewed before attestation existed, and cannot be
# attested now because the range back to 2813d18 contains a merge commit
# (attest requires a linear range).
baseline = "b509568eae7357d8d724ef38139abe180c28ccc8"

# AI-assisted commits must carry a human Signed-off-by.
require_signoff_on_assisted = true

# A manifest's api-reported model that differs from its profile role's model
# (silent substitution by a provider, router or moving alias) is a warning;
# configured or declared mismatches fail. Not a switch (RFC 0005 §11.6).

[trailers]
assisted = "Assisted-by"         # canonical spelling; other casings fail
scope = "AI-Scope"
provenance = "Provenance-Id"
allowed_scopes = ["docs", "tests", "build", "ci", "packaging", "refactor", "code"]

# Trailers carrying an AI identity in Signed-off-by or Co-Authored-By fail,
# as does an AI author. A commit whose committer is an AI identity and that
# changes files must carry Assisted-by. agents.invalid is the committer
# address agents use (AGENTS.md); an agent's GitHub App bot, such as
# racoon-opencode[bot] <ID+racoon-opencode[bot]@users.noreply.github.com>,
# is matched by its harness name.
# Case-insensitive regular expressions, matched against the trailer value
# or identity.
ai_identity_patterns = [
  "noreply@anthropic\\.com",
  "@openai\\.com",
  "copilot",
  "\\bclaude\\b",
  "\\bopencode\\b",
  "\\bgpt-?[0-9]",
  "\\bgemini\\b",
  "\\bqwen",
  "@agents\\.invalid",
]

[critical]
# Attack-surface and privilege-boundary code (fnmatch globs, repository
# relative). AI output in these paths gets extra rules below.
paths = [
  "src/racoon/isakmp*.c",
  "src/racoon/ipsec_doi.c",
  "src/racoon/oakley.c",
  "src/racoon/crypto_openssl.c",
  "src/racoon/openssl_compat.c",
  "src/racoon/privsep.c",
  "src/racoon/admin.c",
  "src/racoon/pfkey.c",
  "src/racoon/nattraversal.c",
  "src/racoon/dnssec.c",
  "src/racoon/kernelpaws*.c",
  "src/racoon/resolvpaws*.c",
  "src/libipsec/*.c",
]

# For these scopes, a contribution touching a critical path requires a
# reviewer contribution from a different model family than every
# contribution that wrote critical files.
require_dissimilar_review_for_scopes = ["code", "refactor"]

# Withheld (organisation-internal) models may not write critical files:
# nobody outside the organisation could act on a recall.
forbid_withheld_in_critical = true

[attestation]
# Every AI-assisted session needs a human attestation (`prov attest`), always:
# attest adds the human's Signed-off-by to every commit in the range
# (message-only rewrite; trees, author and committer stay as they were) and
# writes a signed approval commit whose attestation file lists the reviewed
# commits by `git patch-id --stable`. A reviewed diff changed afterwards
# fails verify. There is no switch to turn attestation or its signature off
# (RFC 0005 §11.6).
#
# The approval commit must be SSH-signed by a key listed in allowed_signers
# (git's gpg.ssh.allowedSignersFile format: "<email> <key-type> <key>").
# The file is read from the BASE of the verified range, so a change cannot
# admit its own key; a base without signers fails. Keys on a hardware token
# (OpenPGP card via gpg-agent, FIDO2 "sk-" keys) prove human presence; the
# agent never holds the key.
allowed_signers = ".provenance/allowed_signers"

# attest refuses to run when one of these environment variables is set: a
# speed bump against an agent attesting its own work, not a security control
# (the signature is). CLAUDECODE is set by Claude Code; AI_AGENT is also set
# in Claude Code cloud sessions. OPENCODE is set by OpenCode for its tool
# processes (verified with OpenCode 1.19.3, which also sets the generic
# AGENT=1; that name is too unspecific to refuse on).
agent_env = ["CLAUDECODE", "AI_AGENT", "OPENCODE"]
