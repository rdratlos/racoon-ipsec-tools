name: legacy-cflags-canary
on:
  # Weekly via main's scheduled-dispatch.yml: schedule triggers only fire
  # from the default branch, so one here never ran.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-old-style-definition-still-needed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool build-essential
      - name: bootstrap
        run: ./bootstrap
      - name: configure WITHOUT -Wno-old-style-definition
        run: ./configure
      - name: build (expected to fail while issue #<N> is open)
        id: build
        continue-on-error: true
        run: make -j"$(nproc)"
      - name: Fail loudly if the workaround is now obsolete
        if: steps.build.outcome == 'success'
        run: |
          echo "::error::Build succeeded WITHOUT -Wno-old-style-definition." 
          echo "::error::Issue #68 appears resolved — remove DISTCHECK_CONFIGURE_FLAGS from Makefile.am."
          exit 1
