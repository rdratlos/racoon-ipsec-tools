# NetBSD CI Build & Test for racoon-ipsec-tools.
# Runs inside a NetBSD 10.x VM via cross-platform-actions/action. Serves two
# purposes the Linux workflows (build-test.yml, shared-ci's ccpp-autotools.yml)
# don't cover: portability to a non-Linux, non-glibc upstream, and ASan/UBSan
# validation, this project's equivalent of the Linux side's Valgrind checks
# (NetBSD's own toolchain, not Linux's, is where those sanitizers run here).
#
# Dependencies (installed via pkgin):
#   autoconf automake libtool pkgconf gmake m4 bison
#
# The base system provides:
#   cc (gcc), flex, krb5 headers, libldap, pam, openssl, libcrypt

name: NetBSD CI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and test'
        required: false
        default: 'main'
        type: string
      enable_sanitizer:
        description: 'Enable ASan/UBSan (on by default -- this is an opt-OUT for a plain sanity build; uncheck to disable)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  netbsd-build-test:
    name: 'NetBSD 10 build & test'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Build on NetBSD 10
        uses: cross-platform-actions/action@v0.27.0
        with:
          operating_system: netbsd
          architecture: x86_64
          # NetBSD 10.0 is the latest stable release available in the action.
          version: '10.0'
          shell: bash
          memory: 4096
          cpu_count: 2
          run: |
            set -euo pipefail

            # ------------------------------------------------------------------
            # Install build dependencies via pkgin.
            # ------------------------------------------------------------------
            echo "=== Syncing package repository ==="
            sudo pkgin -y update

            echo "=== Installing build dependencies ==="
            sudo pkgin -y install autoconf automake libtool pkgconf gmake m4 bison

            # ------------------------------------------------------------------
            # Sanitizer flags: ON by default (this is the ASan/UBSan
            # equivalent of the Linux workflows' Valgrind checks, so it
            # needs to actually run on every push/PR, not just when someone
            # remembers to tick a workflow_dispatch checkbox). Only
            # `github.event.inputs.enable_sanitizer` set explicitly to the
            # string "false" (workflow_dispatch's opt-out) disables it --
            # on push/pull_request/schedule that input doesn't exist at all
            # (empty string), which takes the enabled branch below.
            # ------------------------------------------------------------------
            if [ "${{ github.event.inputs.enable_sanitizer }}" = "false" ]; then
              export SAN_CFLAGS=""
              export SAN_LDFLAGS=""
              echo "=== Sanitizer: disabled (explicit workflow_dispatch opt-out) ==="
            else
              export SAN_CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
              export SAN_LDFLAGS="-fsanitize=address,undefined"
              echo "=== Sanitizer: ENABLED (default) ==="
            fi

            # ------------------------------------------------------------------
            # Environment setup
            # ------------------------------------------------------------------
            export CC=cc

            # ------------------------------------------------------------------
            # Bootstrap the autotools build system
            # ------------------------------------------------------------------
            echo "=== Bootstrapping build system ==="
            ./bootstrap || autoreconf -fi

            # ------------------------------------------------------------------
            # Configure
            # ------------------------------------------------------------------
            CFLAGS="-g -O2 -Wformat -Werror=format-security -Wno-old-style-definition ${SAN_CFLAGS}" \
            LDFLAGS="${SAN_LDFLAGS}" \
            ./configure --verbose \
              --prefix=/usr \
              --sysconfdir=/etc/racoon \
              --libdir=/usr/lib/ipsec-tools \
              --localstatedir=/var/run

            # ------------------------------------------------------------------
            # Build
            # ------------------------------------------------------------------
            echo "=== Building ==="
            NCPU=$(sysctl -n hw.ncpu 2>/dev/null || echo 2)
            make -j"${NCPU}" VERBOSE=1

            # Compile test binaries without running them.
            echo "=== Building test binaries ==="
            make check TESTS=

            # ------------------------------------------------------------------
            # Unit tests
            # ------------------------------------------------------------------
            echo "=== Running unit tests ==="
            (cd test && make check-verbose)
