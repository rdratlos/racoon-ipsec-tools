# Consumer workflow for racoon-ipsec-tools.
# Calls the reusable C/C++ Autotools CI workflow from shared-ci, then applies
# project-specific tri-state reporting (RED / ORANGE / GREEN).
#
# Replace the old monolithic build-test.yml with this file.

name: CI Build & Test

on:
  # No branches: filter — build any branch that gets pushed to, and any PR
  # regardless of its base. The old filters (develop/feature/**/bugfix/**
  # for push, develop-only for pull_request) silently dropped CI for any
  # other branch naming convention or PR base (e.g. chore/** PRs into main).
  push: {}
  pull_request: {}
  schedule:
    # Nightly: catches toolchain / libssl drift on the runner image.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and test (required — no default, so a forgotten value fails fast instead of silently testing develop)'
        required: true

permissions:
  contents: read
  checks: write   # required to publish the dedicated tri-state check run

jobs:
  # Decides what this run tests and where its results go. Tested is always
  # the exact commit the event is about, never a branch name looked up
  # again (a fork's branch name does not exist here, or names a different
  # branch of this repository):
  #   push/schedule        github.sha
  #   pull_request, fork   the PR head SHA; the token is read-only, so
  #                        results go to the job summary, not check runs
  #   pull_request, same   skipped: the push event of that branch already
  #     repository         tests the identical SHA and publishes its checks
  #   workflow_dispatch    the tip of the requested branch
  resolve-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      sha: ${{ steps.ref.outputs.sha || steps.sha.outputs.sha }}
      label: ${{ steps.ref.outputs.label }}
      run: ${{ steps.ref.outputs.run }}
      publish-checks: ${{ steps.ref.outputs.publish-checks }}
    steps:
      - name: Resolve target
        id: ref
        # Branch names are untrusted input (a fork chooses its own): they
        # reach scripts only through env, never as ${{ }} inside code.
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          INPUT_BRANCH: ${{ inputs.branch }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          run=true
          publish=true
          case "$EVENT_NAME" in
            workflow_dispatch)
              # sha comes from the checkout below
              ref=$INPUT_BRANCH
              label=$INPUT_BRANCH
              ;;
            pull_request)
              ref=$PR_HEAD_SHA
              sha=$PR_HEAD_SHA
              label="$PR_HEAD_REPO:$PR_HEAD_REF"
              if [ "$PR_HEAD_REPO" = "$THIS_REPO" ]; then
                run=false
              else
                publish=false
              fi
              ;;
            *)
              ref=$GITHUB_SHA
              sha=$GITHUB_SHA
              label=$REF_NAME
              ;;
          esac
          # Dependabot runs get a read-only token unless granted more;
          # report through the job summary like a fork.
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            publish=false
          fi
          {
            echo "ref=$ref"
            echo "sha=${sha:-}"
            echo "label=$label"
            echo "run=$run"
            echo "publish-checks=$publish"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout requested branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false
      - name: Resolve branch tip
        id: sha
        if: github.event_name == 'workflow_dispatch'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report CI target
        env:
          TARGET_LABEL: ${{ steps.ref.outputs.label }}
          TARGET_SHA: ${{ steps.ref.outputs.sha || steps.sha.outputs.sha }}
          RUN: ${{ steps.ref.outputs.run }}
          PUBLISH: ${{ steps.ref.outputs.publish-checks }}
        run: |
          {
            echo "### CI target"
            echo "- source: \`$TARGET_LABEL\`"
            echo "- sha: \`$TARGET_SHA\`"
            if [ "$RUN" != "true" ]; then
              echo "- skipped: the push run for this branch tests the same commit"
            elif [ "$PUBLISH" != "true" ]; then
              echo "- results: job summaries only (read-only token, no check runs)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Delegate build + test to the shared reusable workflow.
  ci:
    needs: resolve-ref
    if: needs.resolve-ref.outputs.run == 'true'
    uses: rdratlos/shared-ci/.github/workflows/ccpp-autotools.yml@74a0f2f6f84f72b1e14530825606f6ff4c886b61 # v1.1.0
    with:
      ref: ${{ needs.resolve-ref.outputs.ref }}
      # racoon-ipsec-tools requires these runtime libraries at build time.
      project-deps: >-
        libssl-dev libfl-dev libkrb5-dev libldap2-dev
        libpam0g-dev linux-headers-generic libcrypt-dev
      # Full configure invocation with Ubuntu hardening flags.
      #
      # DIAG_CFLAGS: probes the actual toolchain for
      # -fdiagnostics-format=sarif-file (GCC >= 13) rather than assuming
      # it -- this project also targets Ubuntu Bionic (GCC 7), where the
      # flag doesn't exist. On an unsupported compiler the probe just
      # fails and DIAG_CFLAGS stays empty: the build proceeds exactly as
      # before, only without the sidecar .sarif files the annotation job
      # below looks for (which itself no-ops if none exist). Never a
      # build-breaking dependency, only an optional enhancement.
      configure-command: |-
        DIAG_CFLAGS=""
        if echo 'int main(void){return 0;}' | gcc -fdiagnostics-format=sarif-file -S -o /dev/null -xc - 2>/dev/null; then
          DIAG_CFLAGS="-fdiagnostics-format=sarif-file"
          rm -f ./-.sarif
        fi
        CPPFLAGS="-Wdate-time -D_FORTIFY_SOURCE=3" \
        LDFLAGS="-Wl,-Bsymbolic-functions -flto=auto -ffat-lto-objects -Wl,-z,relro" \
        CFLAGS="-g -O2 -Werror=implicit-function-declaration -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer -Wformat -Werror=format-security -fcf-protection $DIAG_CFLAGS" \
        ./configure --verbose --host=x86_64-linux-gnu --build=x86_64-linux-gnu \
          --prefix=/usr --sysconfdir=/etc/racoon --libdir=/usr/lib/ipsec-tools \
          --mandir=\${prefix}/share/man --infodir=\${prefix}/share/info \
          --localstatedir=/var/run --enable-shared --disable-static \
          --enable-frag --enable-gssapi --enable-hybrid --with-libldap \
          --enable-dpd --enable-adminport --with-kernel-headers=/usr/include \
          --with-libpam --without-readline --disable-security-context --enable-natt
      # Compile code + unit test binaries (but do not run them yet).
      build-command: |
        make
        make check TESTS=
      # Run the actual unit tests in the test/ subdirectory, and leave a
      # small pass/skip count in $RICH_TEST_SUMMARY_FILE (a convention
      # ccpp-autotools.yml provides -- see shared-ci's README) so the rich
      # summary/check below has real numbers instead of just pass/fail.
      # check-verbose exits non-zero (via `if`, not a bare pipeline) so
      # this still runs under the runner's default `set -e` and reports
      # partial counts even when it stops early at the first failure.
      test-command: |
        if make check-verbose 2>&1 | tee "$RUNNER_TEMP/check-verbose.log"; then
          status=0
        else
          status=$?
        fi
        total=$(grep -c '^Running ' "$RUNNER_TEMP/check-verbose.log" || true)
        skipped=$(grep -oE '\([0-9]+ skipped\)' "$RUNNER_TEMP/check-verbose.log" | tail -1 | grep -oE '[0-9]+' || true)
        skipped=${skipped:-0}
        {
          echo "| Metric | Value |"
          echo "|---|---|"
          echo "| Test binaries run | ${total:-0} |"
          echo "| Skipped | ${skipped} |"
          echo "| Passed | $([ "$status" -eq 0 ] && echo $(( ${total:-0} - skipped )) || echo '? (stopped at first failure)') |"
        } >> "$RICH_TEST_SUMMARY_FILE"
        exit "$status"
      test-working-directory: test
      # Valgrind is opt-in upstream (both for installing the tool in the
      # build job and for running `make check-valgrind` in the test job).
      # The project's review policy requires check-valgrind to be green
      # before approving PRs, so enable it by default instead of leaving
      # it silently skipped.
      install-valgrind: true
      enable-valgrind: true
      # Same "if, not bare pipeline" pattern as test-command, for the same
      # reason. tools/parse_valgrind_log.py's own fallback (`|| echo '[]'`)
      # means a parser hiccup never breaks this step's exit status.
      valgrind-command: |
        if make check-valgrind 2>&1 | tee "$RUNNER_TEMP/check-valgrind.log"; then
          status=0
        else
          status=$?
        fi
        python3 ../tools/parse_valgrind_log.py < "$RUNNER_TEMP/check-valgrind.log" > "$RICH_VALGRIND_SUMMARY_FILE" 2>/dev/null \
          || echo '[]' > "$RICH_VALGRIND_SUMMARY_FILE"
        exit "$status"

  # Turn GCC's per-file SARIF sidecar diagnostics (if the toolchain wrote
  # any -- see configure-command's DIAG_CFLAGS probe above) into a Checks
  # API check with real `annotations`, scaling past the 10 errors/10
  # warnings/10 notices-per-step, 50-per-run ceiling ::error::/::warning::
  # workflow commands are capped at. No SARIF written (older GCC) is not
  # an error -- the check just reports zero diagnostics.
  annotate-compiler-diagnostics:
    name: 'Annotate compiler diagnostics'
    needs: [resolve-ref, ci]
    runs-on: ubuntu-latest
    if: always() && needs.resolve-ref.outputs.run == 'true'
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout (for the shared annotation script)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
          persist-credentials: false

      - name: Download build tree
        uses: actions/download-artifact@v8
        with:
          name: build-tree
          path: build-tree-download
        continue-on-error: true   # build job may not have produced one (e.g. Configure itself failed)

      - name: Extract build tree
        shell: bash
        run: |
          mkdir -p build-extracted
          if [ -f build-tree-download/build-tree.tar ]; then
            tar -xf build-tree-download/build-tree.tar -C build-extracted
          fi
          rm -rf build-tree-download

      - name: Publish annotations
        uses: actions/github-script@v9
        env:
          TARGET_SHA: ${{ needs.resolve-ref.outputs.sha }}
          PUBLISH_CHECKS: ${{ needs.resolve-ref.outputs.publish-checks }}
        with:
          script: |
            const { collectFindings, publishAnnotations, emitWorkflowAnnotations } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/emit-sarif-annotations.js`);
            const sha = process.env.TARGET_SHA || context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const repoRoot = `${process.env.GITHUB_WORKSPACE}/build-extracted`;

            const findings = collectFindings(repoRoot, repoRoot);

            const report = {
              checkName: 'CI: compiler diagnostics',
              sha,
              sha,
              title: findings.length ? `${findings.length} diagnostic(s) found` : 'No diagnostics',
              summary: (findings.length
                ? `${findings.length} compiler diagnostic(s) from this build's SARIF output.`
                : 'No SARIF diagnostics captured for this build (either a clean build, or this toolchain does not support `-fdiagnostics-format=sarif-file`, i.e. GCC < 13).')
                + `\n\n[Full workflow run](${runUrl})`,
            };
            if (process.env.PUBLISH_CHECKS === 'true') {
              await publishAnnotations({ github, context, core, findings, ...report });
            } else {
              // Read-only token (fork pull request, Dependabot): no check
              // run; the same result as workflow annotations and summary.
              await emitWorkflowAnnotations({ core, findings, ...report });
            }

  # Publish the tri-state check run (RED / ORANGE / GREEN).
  # Runs after the reusable workflow completes, regardless of outcome.
  publish-tristate:
    name: 'Publish tri-state check'
    needs: [resolve-ref, ci]
    runs-on: ubuntu-latest
    if: always() && needs.resolve-ref.outputs.run == 'true'
    permissions:
      contents: read
      checks: write

    steps:
      # Needed to resolve Valgrind's bare-filename debug info (e.g.
      # "vmbuf.c", no directory) back to a real repo path -- see
      # buildBasenameIndex() in the shared annotation script below.
      - name: Checkout (for Valgrind annotation path resolution)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
          persist-credentials: false

      - name: Publish check
        uses: actions/github-script@v9
        # Build outputs carry text the tested code can influence (test
        # names, Valgrind messages): like the branch name, they enter the
        # script only through env.
        env:
          TARGET_LABEL: ${{ needs.resolve-ref.outputs.label }}
          TARGET_SHA: ${{ needs.resolve-ref.outputs.sha }}
          PUBLISH_CHECKS: ${{ needs.resolve-ref.outputs.publish-checks }}
          BUILD_RESULT: ${{ needs.ci.outputs.build-result }}
          UNIT_TEST_RESULT: ${{ needs.ci.outputs.unit-test-result }}
          VALGRIND_RESULT: ${{ needs.ci.outputs.valgrind-result }}
          VALGRIND_SUMMARY: ${{ needs.ci.outputs.valgrind-summary }}
          CONFIGURE_RESULT: ${{ needs.ci.outputs.configure-result }}
          COMPILE_RESULT: ${{ needs.ci.outputs.compile-result }}
          BUILD_SECONDS: ${{ needs.ci.outputs.build-duration-seconds }}
          TEST_SECONDS: ${{ needs.ci.outputs.test-duration-seconds }}
          VALGRIND_SECONDS: ${{ needs.ci.outputs.valgrind-duration-seconds }}
          TEST_SUMMARY: ${{ needs.ci.outputs.test-summary }}
        with:
          script: |
            const { buildBasenameIndex, publishAnnotations, emitWorkflowAnnotations } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/emit-sarif-annotations.js`);
            const branch = process.env.TARGET_LABEL;
            // Use the sha that resolve-ref actually checked out and tested,
            // not context.sha (which on workflow_dispatch is the dispatching
            // ref's tip, not necessarily the target branch).
            const sha = process.env.TARGET_SHA || context.payload.pull_request?.head?.sha || context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Fork pull requests and Dependabot runs get a read-only token:
            // each result then goes to workflow annotations and this job's
            // summary instead of a check run.
            const publish = process.env.PUBLISH_CHECKS === 'true';
            const report = (r) => publish
              ? publishAnnotations({ github, context, core, sha, findings: [], ...r })
              : emitWorkflowAnnotations({ core, findings: [], ...r });

            // An empty result means the stage never reported (setup
            // failure, cancellation): unknown, never a silent success.
            const buildResult = process.env.BUILD_RESULT || 'unknown';
            // Unit-test result alone, excluding Valgrind — Valgrind gets its
            // own check run below so its outcome isn't folded into this one.
            const testResult  = process.env.UNIT_TEST_RESULT || 'unknown';

            let conclusion, title, summary;
            if (buildResult === 'failure') {
              conclusion = 'failure';
              title = 'Build failed';
              summary = 'The project build (`make`) failed. See the Build step logs.';
            } else if (buildResult !== 'success') {
              conclusion = 'failure';
              title = 'Build did not complete';
              summary = 'The build produced no result (setup failure or cancellation). See the workflow run.';
            } else if (testResult === 'failure') {
              conclusion = 'neutral';
              title = 'Build OK — unit tests failed';
              summary = 'The project built successfully, but `make check` reported failing unit tests.';
            } else if (testResult !== 'success') {
              conclusion = 'neutral';
              title = 'Build OK — unit tests did not run';
              summary = 'The project built, but the unit tests produced no result (setup failure or cancellation). See the Test job.';
            } else {
              conclusion = 'success';
              title = 'Build and tests passed';
              summary = 'The project built and all unit tests passed.';
            }

            const text = [
              `**Branch tested:** \`${branch}\``,
              `**Commit:** \`${sha}\``,
              '**Build command:** `make` / `make check TESTS=`',
              '**Test command:** `make check-verbose` (run in `test/`)',
              '',
              `Build outcome: \`${buildResult}\``,
              `Unit-test outcome: \`${testResult}\``,
              '',
              `[Full workflow run](${runUrl})`
            ].join('\n');

            await report({ checkName: 'CI: build & test', conclusion, title, summary, text });

            // Publish Valgrind as its own distinct check run — the review
            // policy requires `make check-valgrind` to be green, and that
            // needs a separate signal instead of being folded into the
            // build/test conclusion above.
            const valgrindResult = process.env.VALGRIND_RESULT || '';

            let vgConclusion, vgTitle, vgSummary;
            if (valgrindResult === 'failure') {
              vgConclusion = 'failure';
              vgTitle = 'Valgrind found memory issues';
              vgSummary = '`make check-valgrind` reported memory issues. See the Test job logs.';
            } else if (valgrindResult === 'success') {
              vgConclusion = 'success';
              vgTitle = 'Valgrind checks passed';
              vgSummary = '`make check-valgrind` completed with no memory issues.';
            } else {
              vgConclusion = 'neutral';
              vgTitle = 'Valgrind not run';
              vgSummary = 'Valgrind checks were skipped for this run (status: ' + (valgrindResult || 'unknown') + ').';
            }

            // Parse tools/parse_valgrind_log.py's JSON (via shared-ci's
            // valgrind-summary pass-through) into Checks API annotations.
            // File paths from Valgrind's debug info are bare filenames
            // (no directory), so resolve each against a basename index
            // built from the checkout above; a finding whose file
            // couldn't be parsed at all (e.g. an error buried entirely in
            // system-library frames with no source line) is still
            // counted but can't be placed as an annotation.
            let vgFindings = [];
            let vgUnplaced = 0;
            try {
              const parsed = JSON.parse(process.env.VALGRIND_SUMMARY || '[]');
              const basenameIndex = buildBasenameIndex(process.env.GITHUB_WORKSPACE, ['.c', '.h']);
              for (const f of parsed) {
                if (!f.file) { vgUnplaced++; continue; }
                const resolvedPath = basenameIndex.get(f.file) || f.file;
                const line = f.line || 1;
                vgFindings.push({
                  path: resolvedPath,
                  start_line: line,
                  end_line: line,
                  annotation_level: 'failure',
                  message: `${f.message} (in ${f.binary})`,
                  title: 'Valgrind',
                });
              }
            } catch (e) {
              core.warning(`Failed to parse valgrind-summary JSON: ${e}`);
            }

            const vgText = [
              `**Branch tested:** \`${branch}\``,
              `**Commit:** \`${sha}\``,
              '**Command:** `make check-valgrind` (run in `test/`)',
              '',
              `Valgrind outcome: \`${valgrindResult || 'unknown'}\``,
              vgUnplaced ? `${vgUnplaced} finding(s) could not be placed at a source line (no debug info in that stack frame).` : '',
              '',
              `[Full workflow run](${runUrl})`
            ].filter(Boolean).join('\n');

            await report({
              findings: vgFindings,
              checkName: 'CI: valgrind',
              title: vgTitle,
              summary: vgSummary,
              text: vgText,
              conclusion: vgConclusion,
            });

            // --- Rich overall check: one Checks-API entry covering every
            // stage, in addition to (not replacing) the two check runs
            // above -- those names may already be wired into branch
            // protection, so this is purely additive.
            const configureResult = process.env.CONFIGURE_RESULT || '';
            const compileResult   = process.env.COMPILE_RESULT || '';
            const buildSeconds    = process.env.BUILD_SECONDS || '';
            const testSeconds     = process.env.TEST_SECONDS || '';
            const valgrindSeconds = process.env.VALGRIND_SECONDS || '';
            const testSummaryRaw  = (process.env.TEST_SUMMARY || '').trim();

            const icon = (r) => ({
              success: '✅', failure: '❌', skipped: '⏭️'
            }[r] || '⚪ n/a');

            const stageRows = [
              ['Configure', icon(configureResult), configureResult || 'n/a'],
              ['Build', icon(compileResult), compileResult || 'n/a'],
              ['Unit tests', icon(testResult), testResult || 'n/a'],
              ['Valgrind', icon(valgrindResult || 'skipped'), valgrindResult || 'not run'],
              ['Packaging', '⚪', 'not run by this workflow'],
              ['Compile Canary', '↗️', '[separate check — OpenSSL 4.0 canary](' +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commits/${sha}/checks)`],
            ];

            // Overall: FAILURE if Configure/Build/a real test failure broke
            // the build; WARNING if the build is sound but something softer
            // (tests, Valgrind) is red; SUCCESS otherwise. Checks API has no
            // literal "warning" conclusion, so WARNING maps to `neutral`
            // (same mapping the existing build/valgrind checks above use),
            // distinguished by the title text instead.
            let overallConclusion, overallLabel;
            if (buildResult !== 'success' || configureResult === 'failure' || compileResult === 'failure') {
              overallConclusion = 'failure';
              overallLabel = 'FAILURE';
            } else if (testResult !== 'success' || valgrindResult === 'failure') {
              overallConclusion = 'neutral';
              overallLabel = 'WARNING';
            } else {
              overallConclusion = 'success';
              overallLabel = 'SUCCESS';
            }

            const stageTable = [
              '| Stage | Status | Result |',
              '|---|---|---|',
              ...stageRows.map(([name, ic, res]) => `| ${name} | ${ic} | ${res} |`)
            ].join('\n');

            const overallText = [
              `**Branch tested:** \`${branch}\``,
              `**Commit:** \`${sha}\``,
              '',
              stageTable,
              '',
              '### Timing',
              `- Build (Configure + Compile): ${buildSeconds || '?'}s`,
              `- Unit tests: ${testSeconds || '?'}s`,
              `- Valgrind: ${valgrindSeconds ? valgrindSeconds + 's' : 'not run'}`,
              '',
              '### Test counts',
              testSummaryRaw || '_test-command did not report counts._',
              '',
              `[Full workflow run](${runUrl}) (artifacts are listed near the bottom of that page)`
            ].join('\n');

            await report({
              checkName: 'CI: overall',
              conclusion: overallConclusion,
              title: `${overallLabel}: ${stageRows.filter(r => r[1] === '❌').map(r => r[0]).join(', ')
                || (overallLabel === 'SUCCESS' ? 'all stages green' : 'a stage reported no result')}`,
              summary: `Overall: **${overallLabel}**. See the stage table for per-stage results.`,
              text: overallText,
            });

            // Same content in the workflow's own step summary, for anyone
            // looking at the Actions run directly rather than the PR
            // checks tab.
            // Without check runs, report() already wrote it to the summary.
            if (publish) await core.summary
              .addHeading('CI: overall — ' + overallLabel)
              .addRaw(overallText, true)
              .write();
