# .github/workflows/openssl-deprecation-canary.yml
#
# OpenSSL 4.0 readiness canary.
#
# Compiles selected source files against a "no deprecated symbols"
# configuration (OPENSSL_API_COMPAT=0x40000000L + OPENSSL_NO_DEPRECATED),
# which makes deprecated declarations disappear from the OpenSSL headers
# entirely -- simulating their removal in OpenSSL 4.0.
#
# IMPORTANT: This is scoped to specific files, NOT the whole tree.
#   - openssl_compat.c is the deliberate containment point for deprecated
#     calls and is EXEMPT -- it is expected to break under 4.0 by design.
#
# Two checks with different intent:
#   1. Regression guard (crypto_openssl.o): expected GREEN today. If it goes
#      red, a direct deprecated call was reintroduced into the daemon. Real
#      alarm -> this step is allowed to fail the job (blocking).
#   2. Readiness tracker (plainrsa-gen.o): expected RED today (deferred work,
#      see issue). Goes green when the migration lands. Non-blocking until
#      then.

name: OpenSSL Deprecation Canary

permissions:
  contents: read
  checks: write   # required to publish the dedicated canary check runs

on:
  # No branches: filter — build any branch that gets pushed to, and any PR
  # regardless of its base. The old filters (develop-only for both push and
  # pull_request) silently dropped the canary for any other branch naming
  # convention or PR base (e.g. chore/** PRs into main), matching the same
  # gap fixed in build-test.yml.
  push: {}
  pull_request: {}
  schedule:
    # Weekly: also catches the runner's libssl advancing toward 4.0 over time.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the canary against (required — no default, so a forgotten value fails fast instead of silently testing develop)'
        required: true

jobs:
  # Decides what this run tests and where its results go. Tested is always
  # the exact commit the event is about, never a branch name looked up
  # again (a fork's branch name does not exist here, or names a different
  # branch of this repository):
  #   push/schedule        github.sha
  #   pull_request, fork   the PR head SHA; the token is read-only, so
  #                        results go to the job summary, not check runs
  #   pull_request, same   skipped: the push event of that branch already
  #     repository         tests the identical SHA and publishes its checks
  #   workflow_dispatch    the tip of the requested branch
  resolve-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      sha: ${{ steps.ref.outputs.sha || steps.sha.outputs.sha }}
      label: ${{ steps.ref.outputs.label }}
      run: ${{ steps.ref.outputs.run }}
      publish-checks: ${{ steps.ref.outputs.publish-checks }}
    steps:
      - name: Resolve target
        id: ref
        # Branch names are untrusted input (a fork chooses its own): they
        # reach scripts only through env, never as ${{ }} inside code.
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          INPUT_BRANCH: ${{ inputs.branch }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          run=true
          publish=true
          case "$EVENT_NAME" in
            workflow_dispatch)
              # sha comes from the checkout below
              ref=$INPUT_BRANCH
              label=$INPUT_BRANCH
              ;;
            pull_request)
              ref=$PR_HEAD_SHA
              sha=$PR_HEAD_SHA
              label="$PR_HEAD_REPO:$PR_HEAD_REF"
              if [ "$PR_HEAD_REPO" = "$THIS_REPO" ]; then
                run=false
              else
                publish=false
              fi
              ;;
            *)
              ref=$GITHUB_SHA
              sha=$GITHUB_SHA
              label=$REF_NAME
              ;;
          esac
          # Dependabot runs get a read-only token unless granted more;
          # report through the job summary like a fork.
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            publish=false
          fi
          {
            echo "ref=$ref"
            echo "sha=${sha:-}"
            echo "label=$label"
            echo "run=$run"
            echo "publish-checks=$publish"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout requested branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false
      - name: Resolve branch tip
        id: sha
        if: github.event_name == 'workflow_dispatch'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report CI target
        env:
          TARGET_LABEL: ${{ steps.ref.outputs.label }}
          TARGET_SHA: ${{ steps.ref.outputs.sha || steps.sha.outputs.sha }}
          RUN: ${{ steps.ref.outputs.run }}
          PUBLISH: ${{ steps.ref.outputs.publish-checks }}
        run: |
          {
            echo "### Canary target"
            echo "- source: \`$TARGET_LABEL\`"
            echo "- sha: \`$TARGET_SHA\`"
            if [ "$RUN" != "true" ]; then
              echo "- skipped: the push run for this branch tests the same commit"
            elif [ "$PUBLISH" != "true" ]; then
              echo "- results: job summaries only (read-only token, no check runs)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  canary:
    needs: resolve-ref
    if: needs.resolve-ref.outputs.run == 'true'
    uses: rdratlos/shared-ci/.github/workflows/ccpp-target-compile.yml@claude/loving-rubin-99e64p
    with:
      ref: ${{ needs.resolve-ref.outputs.ref }}
      project-deps: 'libssl-dev libfl-dev libkrb5-dev libldap2-dev libpam0g-dev linux-headers-generic libcrypt-dev'
      env-vars: |
        NODEP="-DOPENSSL_API_COMPAT=0x30000000L -DOPENSSL_NO_DEPRECATED"
      configure-command: >
        CPPFLAGS="-Wdate-time -D_FORTIFY_SOURCE=3"
        LDFLAGS="-Wl,-Bsymbolic-functions -flto=auto -ffat-lto-objects -Wl,-z,relro"
        CFLAGS="-g -O2 -Werror=implicit-function-declaration -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer -Wformat -Werror=format-security -fcf-protection -Wno-old-style-definition"
        ./configure --verbose --host=x86_64-linux-gnu --build=x86_64-linux-gnu
        --prefix=/usr --sysconfdir=/etc/racoon --libdir=/usr/lib/ipsec-tools
        --mandir=${prefix}/share/man --infodir=${prefix}/share/info
        --localstatedir=/var/run --enable-shared --disable-static
        --enable-frag --enable-gssapi --enable-hybrid --with-libldap
        --enable-dpd --enable-adminport --with-kernel-headers=/usr/include
        --with-libpam --without-readline --disable-security-context --enable-natt
      targets: >-
        [
          {"name":"guard","label":"Regression guard: crypto_openssl.o","dir":"src/racoon","target":"crypto_openssl.o","cc":"gcc ${NODEP}","blocking":true},
          {"name":"tracker","label":"Readiness tracker: plainrsa-gen.o","dir":"src/racoon","target":"plainrsa-gen.o","cc":"gcc ${NODEP}","blocking":false}
        ]
      artifact-name: openssl-canary-logs

  annotate:
    needs: canary
    runs-on: ubuntu-latest
    steps:
      - name: Annotate readiness status
        env:
          CANARY_RESULT: ${{ needs.canary.outputs.result }}
        run: |
          if [ "$CANARY_RESULT" = "success" ]; then
            echo "::notice title=4.0 Readiness::All tracked checks pass. If the readiness tracker is green, the RSA*->EVP_PKEY migration may be complete -- consider promoting it to a hard gate and closing the migration issue."
          else
            echo "::notice title=4.0 Readiness::See the compile results in the canary job summary. Regression of reintroduced deprecated *calls* is guarded separately by the normal -Werror build."
          fi

  # Turn a genuine regression-guard failure into inline annotations on the
  # offending line(s), instead of making reviewers open the raw compile log.
  #
  # Deliberately still plain ::error:: workflow commands, not the SARIF ->
  # Checks-API-annotations mechanism build-test.yml uses for the main
  # build (.github/scripts/emit-sarif-annotations.js): this canary only
  # ever compiles 2 targets, so it can never produce more than a couple of
  # findings -- nowhere near the 10-per-step/50-per-run ceiling that
  # mechanism exists to get past. Migrating it would just be novelty.
  #
  # Deliberately scoped to the *error* output of a failed compile under
  # -DOPENSSL_NO_DEPRECATED (a plain "file:line:col: error: ..." grep) --
  # not the -Wdeprecated-declarations *warning* path tools/gen_deprecation_
  # report.py and tools/emit_gha_annotations.py cover. That warning path
  # only fires from a `make dev` build (RACOON_WARN_DEPRECATED, full
  # project rebuild with deprecated symbols still visible so they can warn
  # instead of vanishing) which is a materially more expensive build than
  # this canary's two single-.o compiles; running it on every push/PR just
  # for inline annotations was judged not worth doubling this workflow's
  # build cost for a single-maintainer project where `make dev &&
  # make deprecation-report` already produces the same report on demand
  # (documented in test/README.md). Revisit if CI minutes stop being the
  # binding constraint.
  annotate-regressions:
    name: 'Annotate regression-guard failures'
    needs: [resolve-ref, canary]
    if: needs.canary.outputs.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Download compile logs
        uses: actions/download-artifact@v7
        with:
          name: openssl-canary-logs
          path: compile-logs

      - name: Emit annotations for compile errors
        shell: bash
        run: |
          # GCC's plain diagnostic line shape: file:line:col: error: message
          found=0
          if [ -f compile-logs/guard.log ]; then
            while IFS=: read -r file line col _level message; do
              found=$((found + 1))
              echo "::error file=${file},line=${line},col=${col},title=Deprecated OpenSSL call reintroduced::${message# }"
            done < <(grep -E '^[^:]+:[0-9]+:[0-9]+: error:' compile-logs/guard.log || true)
          fi
          echo "Emitted $found annotation(s) from the regression guard's compile log."

  # Publish per-target check runs on the PR's Checks tab, mirroring
  # build-test.yml's publish-tristate job. The reusable workflow only
  # exposes a single JSON `results` output (one entry per target), not
  # per-target named outputs, so it's parsed here instead of guessed at.
  publish-canary-check:
    name: 'Publish canary checks'
    needs: [resolve-ref, canary]
    runs-on: ubuntu-latest
    if: always() && needs.resolve-ref.outputs.run == 'true'
    permissions:
      checks: write

    steps:
      # The compile results carry text the compiled code can influence: like
      # the branch name, they enter the script only through env.
      - name: Publish check runs
        uses: actions/github-script@v8
        env:
          TARGET_LABEL: ${{ needs.resolve-ref.outputs.label }}
          TARGET_SHA: ${{ needs.resolve-ref.outputs.sha }}
          PUBLISH_CHECKS: ${{ needs.resolve-ref.outputs.publish-checks }}
          CANARY_RESULTS: ${{ needs.canary.outputs.results }}
        with:
          script: |
            const branch = process.env.TARGET_LABEL;
            const sha = process.env.TARGET_SHA || context.payload.pull_request?.head?.sha || context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Fork pull requests and Dependabot runs get a read-only token:
            // the results then go to this job's summary, not check runs.
            const publish = process.env.PUBLISH_CHECKS === 'true';
            const report = async (name, conclusion, output) => {
              if (publish) {
                await github.rest.checks.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  head_sha: sha,
                  status: 'completed',
                  conclusion,
                  output,
                });
                return;
              }
              await core.summary
                .addHeading(`${name}: ${conclusion}`, 3)
                .addRaw(`**${output.title}**\n\n${output.summary}\n\n${output.text}\n\n`, true)
                .addRaw('(not published as a check run: read-only token)\n', true)
                .write();
            };

            let results = [];
            try {
              results = JSON.parse(process.env.CANARY_RESULTS || '[]');
            } catch (e) {
              core.warning(`Failed to parse canary results JSON: ${e}`);
            }

            const guard = results.find(r => r.name === 'guard');
            const tracker = results.find(r => r.name === 'tracker');

            // Regression guard: a real failure here is a genuine alarm, so
            // it is reported as `failure` if it breaks.
            const guardOutcome = guard?.outcome || 'unknown';
            let guardConclusion, guardTitle, guardSummary;
            if (guardOutcome === 'success') {
              guardConclusion = 'success';
              guardTitle = 'No deprecated OpenSSL calls in crypto_openssl.o';
              guardSummary = 'crypto_openssl.o compiled cleanly under the OpenSSL 4.0 "no deprecated symbols" configuration.';
            } else if (guardOutcome === 'failure') {
              guardConclusion = 'failure';
              guardTitle = 'Deprecated OpenSSL call reintroduced';
              guardSummary = 'crypto_openssl.o failed to compile under the OpenSSL 4.0 "no deprecated symbols" configuration — a deprecated call was reintroduced into the daemon.';
            } else {
              guardConclusion = 'neutral';
              guardTitle = 'Regression guard result unavailable';
              guardSummary = 'Could not determine the regression guard outcome for this run.';
            }

            const guardText = [
              `**Branch tested:** \`${branch}\``,
              `**Commit:** \`${sha}\``,
              `**Target compiled:** \`${guard?.target || 'crypto_openssl.o'}\` (in \`src/racoon\`)`,
              '',
              '**Regression guard** — expected GREEN. A failure here is a real alarm: it means a direct deprecated OpenSSL call was reintroduced into the daemon. This check is blocking.',
              '',
              `Outcome: \`${guardOutcome}\``,
              '',
              `[Full workflow run](${runUrl})`
            ].join('\n');

            await report('CI: OpenSSL 4.0 canary (regression guard)', guardConclusion, { title: guardTitle, summary: guardSummary, text: guardText });

            // Readiness tracker: informational only. It is expected to be
            // RED until the RSA*->EVP_PKEY migration lands, so it must
            // never report `failure` — only `success` or `neutral`.
            const trackerOutcome = tracker?.outcome || 'unknown';
            let trackerConclusion, trackerTitle, trackerSummary;
            if (trackerOutcome === 'success') {
              trackerConclusion = 'success';
              trackerTitle = 'OpenSSL 4.0 readiness: plainrsa-gen.o migrated';
              trackerSummary = 'plainrsa-gen.o now compiles cleanly under the OpenSSL 4.0 "no deprecated symbols" configuration — the RSA*->EVP_PKEY migration appears complete.';
            } else {
              trackerConclusion = 'neutral';
              trackerTitle = 'OpenSSL 4.0 readiness: migration pending (informational)';
              trackerSummary = 'plainrsa-gen.o still uses deprecated OpenSSL APIs. This is expected today and does not block this PR.';
            }

            const trackerText = [
              `**Branch tested:** \`${branch}\``,
              `**Commit:** \`${sha}\``,
              `**Target compiled:** \`${tracker?.target || 'plainrsa-gen.o'}\` (in \`src/racoon\`)`,
              '',
              '**Readiness tracker** — informational only, non-blocking. Confirms plainrsa-gen remains free of direct OpenSSL 4.0-incompatible calls. GREEN = tool is 4.0-ready (via openssl_compat). Turns RED if a deprecated call is reintroduced outside the shim boundary.',
              '',
              `Outcome: \`${trackerOutcome}\``,
              '',
              `[Full workflow run](${runUrl})`
            ].join('\n');

            await report('CI: OpenSSL 4.0 canary (readiness tracker)', trackerConclusion, { title: trackerTitle, summary: trackerSummary, text: trackerText });
