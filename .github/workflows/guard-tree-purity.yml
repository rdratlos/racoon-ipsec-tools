# Tree-separation policy guard for `main` -- the `main` half of the
# two-way branch-sync protection described in CONTRIBUTING.md.
#
# Policy: `.github/workflows/` files are each owned by exactly one branch
# (`main` or `develop`); `.claude/` (Claude Code developer tooling) is
# develop-owned entirely. Neither branch's owned paths may appear in a
# change aimed at the other. This workflow enforces the `main`-bound
# direction: any PR into `main`, or any push to `main`, that touches a
# develop-owned path fails the check so it cannot be merged/landed. The
# mirror check for the `develop`-bound direction lives on `develop` itself
# (`.github/workflows/guard-branch-purity.yml`) -- per the same policy,
# that guard cannot live here, since main-branch guards cannot fire on
# develop-targeting events (see CONTRIBUTING.md's tree-separation
# section for why).
#
# This replaces the old CONTRIBUTING.md instruction to manually run
# `git diff --stat` before merging main into develop -- that step is easy
# to forget and was never enforced. It also generalizes the previous
# version of this guard, which only checked `.claude/`.
#
# The guard inspects the *diff* (what the change introduces), not just the
# final tree, so a PR that adds and then removes a forbidden path in the
# same range is still flagged -- the point is that these paths have no
# business appearing in changes aimed at main at all.

name: Guard tree purity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-develop-owned-paths:
    name: Reject develop-owned paths on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diffing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if any develop-owned path appears in the diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          ZERO="0000000000000000000000000000000000000000"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Three-dot: paths the PR introduces relative to the merge base.
            RANGE="${PR_BASE_SHA}...${PR_HEAD_SHA}"
            echo "Pull request diff range: $RANGE"
            CHANGED=$(git diff --name-only "$RANGE")
          elif [ "$PUSH_BEFORE" = "$ZERO" ]; then
            # Branch/tag creation or force-push with no prior tip we can
            # diff against: fall back to scanning the whole pushed tree.
            echo "No usable 'before' SHA; scanning full tree at $PUSH_AFTER"
            CHANGED=$(git ls-tree -r --name-only "$PUSH_AFTER")
          else
            RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
            echo "Push diff range: $RANGE"
            CHANGED=$(git diff --name-only "$RANGE")
          fi

          # Develop-owned paths: .claude/ entirely, plus the specific
          # workflow/test files that are develop's own CI surface (see
          # CONTRIBUTING.md's tree-separation section for the full list
          # and rationale). Keep this in sync with guard-branch-purity.yml
          # on develop, which enforces the mirror list.
          FORBIDDEN_RE='^(\.claude/|\.github/workflows/develop-build-test\.yml$|\.github/workflows/legacy-cflags-canary\.yml$|\.github/workflows/racoon-hooks\.yml$|\.github/workflows/guard-branch-purity\.yml$|test/expected-skips\.yml$|test/check-expected-skips\.sh$)'

          OFFENDING=$(printf '%s\n' "$CHANGED" | grep -E "$FORBIDDEN_RE" || true)

          if [ -n "$OFFENDING" ]; then
            echo "::error::Tree-separation policy violation: these paths are develop-owned and must not land on main."
            echo "Offending paths:"
            printf '%s\n' "$OFFENDING" | sed 's/^/  - /'
            echo ""
            echo "See CONTRIBUTING.md's tree-separation policy section."
            exit 1
          fi

          echo "OK: no develop-owned paths in the change. Tree-separation policy satisfied."
