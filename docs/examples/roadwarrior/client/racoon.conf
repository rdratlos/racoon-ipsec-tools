# racoon.conf - Roadwarrior Client Configuration
#
# Modern, production-ready configuration for a roadwarrior IPsec client
# connecting to a racoon VPN gateway using X.509 client certificates and
# XAuth username/password authentication, with Mode Config for dynamic
# address allocation.
#
# Install-safe by default: the "remote" section below is entirely
# commented out, so this file can be installed and racoon.service started
# immediately with no certificates in place yet — it just idles at near
# -zero footprint until you fill in your gateway/certificate details and
# uncomment that section.  See the "Remote Section" comment for the exact
# activation steps.
#
# This configuration is designed for Linux clients.  It pairs with the
# phase1-up.sh and phase1-down.sh script hooks in this directory to
# handle split routing, SPD policy registration, and DNS configuration.
#
# NetworkManager split-DNS note: real per-domain DNS routing (only queries
# for the corporate domains go through the tunnel) requires NetworkManager
# to be running with `dns=systemd-resolved` (or `dns=dnsmasq`) in
# NetworkManager.conf.  With the default `dns=default` plugin, NM writes a
# flat /etc/resolv.conf with no concept of per-domain routing, so
# phase1-up.sh falls back to redirecting ALL DNS lookups through the VPN
# resolver while the tunnel is up, and logs a warning saying so.  Check
# `NetworkManager --print-config | grep -A3 '\[main\]'` on the client to
# see which mode is active.
#
# Key design decisions:
#   - Main mode exchange for full PFS and identity protection during
#     phase 1 negotiation.
#   - AES-256 / SHA-256 / DH group 15 (3072-bit) aligned with the
#     server's BSI TR-02102-3 proposal.
#   - XAuth-RSA client-side authentication: the client authenticates
#     with a username/password, with the password signed by the client's
#     RSA private key.  The password is stored in the pre_shared_key file,
#     keyed by the xauth_login value.
#   - Certificate verification enforced on both sides: the client verifies
#     the server's certificate against the CA, and the server verifies
#     the client's certificate.
#   - DPD (Dead Peer Detection) with automatic reconnection via rekey.
#   - NAT-T and IKE fragmentation for clients behind NAT gateways.

# ---------------------------------------------------------------------------
# Path Specifications
# ---------------------------------------------------------------------------
# Directory containing certificate and key files.
path certificate "/etc/racoon/certs";

# Pre-shared key file for XAuth passwords.
# The password for the xauth_login user is stored in this file, using the
# login name as the key identifier.  Example entry:
#
#   <xauth_login_name> <password>
#
# See README for the pre_shared_key file format.
path pre_shared_key "/etc/racoon/psk.txt";

# Directory racoon resolves the "remote" block's relative script
# filenames against, and the boundary privsep enforces at execution time:
# this is where the maintained split-DNS and routing hook set
# (racoon-hook-lib.sh, phase1-up.sh, phase1-down.sh, racoon-dns-detect)
# is installed. Required whenever privsep {} is active (see below), and
# load-bearing here, unlike the gateway example: this client's "remote"
# block genuinely invokes these scripts, by filename only (giving a full
# path in "script" as well as "path script" here fails to start).
path script "/etc/racoon/scripts";

# ---------------------------------------------------------------------------
# Privilege Separation
# ---------------------------------------------------------------------------
# Drops root privileges in the negotiation process after startup, keeping
# only a small privileged helper (handles private key/PSK access and
# script execution) running as root. The "racoon" system user/group must
# already exist -- see README.Debian / the Arch package's sysusers.d entry,
# or create it yourself for a from-source install. Requires path
# certificate and path script above to both be set.
privsep {
    user "racoon";
    group "racoon";
}

# ---------------------------------------------------------------------------
# Listen Section
# ---------------------------------------------------------------------------
listen {
    # adminsock provides a Unix domain socket for racoonctl(1) administration.
    # Active by default with group "racoon": under privsep (above),
    # racoonctl is the tool a non-root operator uses to connect, disconnect,
    # and check the status of this VPN, and it needs group access to this
    # socket to do so -- see racoonctl(1) and racoon-admin-guide.html
    # Sec 8.5. This also requires /run/racoon itself to grant group
    # "racoon" traversal; the shipped systemd unit already sets
    # RuntimeDirectoryMode=0750 for that. Starting racoon manually
    # (not via systemd) instead requires creating /run/racoon by hand at
    # that same group/mode first.
    #
    # The socket path below is the compile-time ADMINPORTDIR default on
    # this project's own build rules (Debian, Arch); if yours differs,
    # match racoonctl(1)'s FILES section, or point racoonctl at a custom
    # location with its own -s <path> option instead of changing this.
    adminsock "/var/run/racoon/racoon.sock" "root" "racoon" 0660;
}

# ---------------------------------------------------------------------------
# Timer Section
# ---------------------------------------------------------------------------
# NAT-Traversal keepalive: sends empty NAT-T packets every 15 seconds to
# keep NAT mappings alive.  This is essential for clients behind NAT
# gateways that would otherwise forget the UDP 4500 mapping.
timer {
    natt_keepalive 15 seconds;
}

# ---------------------------------------------------------------------------
# Remote Section — Phase 1 (IKE) connection to the VPN gateway
# ---------------------------------------------------------------------------
# Commented out by default.  racoon reads certificate_type/ca_type files
# from disk while *parsing* racoon.conf (not lazily on first connection),
# so an active remote block referencing client.crt/client.key/ca.crt
# before those files exist makes racoon fail to start outright.  Leaving
# this block commented means `racoon.service` starts and idles cleanly
# right after installing the package — no certificates required yet, no
# connection attempted, near-zero footprint — and stays that way until
# you deliberately activate it:
#
#   1. Drop your certificate, key, and CA certificate into
#      /etc/racoon/certs (see README.Debian for exact permissions).
#   2. Below: replace 192.0.2.50 with your gateway's address, set
#      xauth_login, and check the proposal against what your
#      administrator specifies.
#   3. Uncomment every line from "remote 192.0.2.50 {" to its closing "}".
#   4. Reload/restart racoon (or `racoonctl vc <gateway>` to connect
#      without waiting for on-demand traffic).
#
# remote 192.0.2.50 {
#     # Use Main Mode for identity protection and PFS support.
#     exchange_mode main;
#
#     # Client and peer identifiers.  The client identifies itself by its
#     # X.509 certificate's ASN.1 Distinguished Name.
#     my_identifier asn1dn;
#
#     # Verify that the server's certificate matches its identity.  This
#     # prevents man-in-the-middle attacks where a rogue server presents
#     # a valid but unexpected certificate.
#     peers_identifier asn1dn;
#     verify_identifier on;
#
#     # Require server certificate validation.
#     verify_cert on;
#
#     # Client X.509 certificate and private key for mutual authentication.
#     certificate_type x509 "client.crt" "client.key";
#
#     # CA certificate used to verify the server's certificate chain.
#     ca_type x509 "ca.crt";
#
#     # Client initiates the connection (default: off).
#     passive off;
#
#     # Negotiation lifetime.  Matches the server's 24-hour phase 1 SA.
#     lifetime time 24 hour;
#
#     # proposal_check strict ensures the server's phase 2 counters
#     # match our expectations.  As the initiator, the client controls
#     # the proposal and strict is appropriate.
#     proposal_check strict;
#
#     # NAT-Traversal for clients behind NAT.
#     nat_traversal on;
#
#     # IKE fragmentation for MTU-constrained networks.
#     ike_frag on;
#
#     # Enable Mode Config to receive IP address, DNS, split DNS, and
#     # split network from the server.
#     mode_cfg on;
#
#     # Dead Peer Detection parameters:
#     #   dpd_delay   - seconds between liveness probes
#     #   dpd_retry   - seconds to wait for a reply before retrying
#     #   dpd_maxfail - number of failed probes before declaring peer dead
#     dpd_delay 30;
#     dpd_retry 5;
#     dpd_maxfail 3;
#
#     # XAuth login name.  The corresponding password is looked up in the
#     # pre_shared_key file using this value as the key identifier.
#     xauth_login "<xauth_login>";
#
#     # Script hooks executed by racoon after phase 1 succeeds or fails.
#     # phase1-up.sh:  installs split routes, SPD policies, and DNS config.
#     # phase1-down.sh: tears down routes, SPD policies, and DNS config.
#     # Filename only, not a full path: racoon resolves this against this
#     # file's "path script" directive above (which is also where privsep
#     # enforces its execution-time path-safety check) -- giving a full
#     # path here as well as "path script" fails to start.
#     script "phase1-up.sh" phase1_up;
#     script "phase1-down.sh" phase1_down;
#
#     # Phase 1 proposal (BSI TR-02102-3 compliant).
#     # This must match one of the server's proposals.  The server's primary
#     # proposal is AES-256 / SHA-256 / DH 15 with xauth_rsa_server.
#     #
#     # xauth_rsa_client: the client sends XAuth credentials (username
#     # and password) signed with the client's RSA private key.  This is
#     # the counterpart of the server's xauth_rsa_server.
#     proposal {
#         encryption_algorithm aes 256;
#         hash_algorithm sha256;
#         authentication_method xauth_rsa_client;
#         dh_group 15;
#     }
# }

# ---------------------------------------------------------------------------
# SA Info Section — Phase 2 (IPsec) proposals
# ---------------------------------------------------------------------------
# These proposals are sent to the server during phase 2 negotiation.
# The server's sainfo determines which proposal is accepted.
#
# On Linux clients, hmac_sha256 is safe here because racoon proposes
# multiple algorithms and the server selects.  If the server does not
# support hmac_sha256 (e.g., due to the PF_KEY truncation bug), it will
# fall back to hmac_sha512 or hmac_sha1.
sainfo anonymous {
    # Perfect Forward Secrecy for phase 2 (optional).
    # Uncomment to enable PFS.  Group 14 (modp2048) is appropriate when
    # phase 1 uses DH group 15 (modp3072).
    # pfs_group 14;

    lifetime time 1 hour;
    encryption_algorithm aes 256;
    authentication_algorithm hmac_sha256, hmac_sha512, hmac_sha1;
    compression_algorithm deflate;
}
