# racoon.conf - VPN Gateway (Roadwarrior Server)
#
# Modern configuration for a roadwarrior VPN gateway using racoon.
# Aligned with BSI TR-02102-3 cipher recommendations and the phase1-up.sh
# / phase1-down.sh helper scripts (split routes, split DNS, per-network SPD).
#
# Key design decisions:
#   - Main mode exchange (no aggressive mode) for full PFS and identity
#     protection during phase 1 negotiation.
#   - AES-256 / SHA-256 / DH group 15 (3072-bit) as primary proposal,
#     with DH group 14 (2048-bit) fallback for iOS clients.
#   - XAuth-RSA server-side authentication: client authenticates with
#     username/password signed by the server's RSA key pair.
#   - generate_policy unique: safe dynamic policy generation with monotonic
#     reqid, preventing policy pollution from concurrent clients.
#   - proposal_check claim: allows the client to propose shorter lifetimes
#     or smaller key lengths without rejecting the SA.
#   - Certificate and identity verification enforced (verify_cert,
#     verify_identifier) to prevent rogue-server attacks.
#   - split_network include and split_dns: fed to phase1-up.sh via the
#     SPLIT_INCLUDE_CIDR and INTERNAL_SPLITDNS_DOMAINS environment
#     variables for split-route and DNS configuration on the client side.
#   - PFS for phase 2 is commented out by default.  Uncomment pfs_group
#     in both mode_cfg and sainfo to enable it.  The phase 1 DH group
#     (15 = 3072-bit) must be >= the phase 2 PFS group.

# ---------------------------------------------------------------------------
# Path Specifications
# ---------------------------------------------------------------------------
path certificate "/etc/racoon/certs";

# ---------------------------------------------------------------------------
# Listen Section
# ---------------------------------------------------------------------------
# IMPORTANT: Replace the listen addresses with your gateway's actual IP.
# Without explicit listen directives, racoon binds to all interfaces (0.0.0.0),
# including WireGuard tunnels, Docker bridges, and other virtual interfaces.
# Binding only to the public-facing address prevents unwanted ISAKMP traffic
# on internal interfaces.
#
# The isakmp directive binds port 500 (UDP) for native IKE.
# The isakmp_natt directive binds port 4500 (UDP) for NAT-Traversal.
listen {
    isakmp 10.0.12.2;
    isakmp_natt 10.0.12.2[4500];
    adminsock disabled;
}

# ---------------------------------------------------------------------------
# Timer Section
# ---------------------------------------------------------------------------
timer {
    natt_keepalive 15 seconds;
}

# ---------------------------------------------------------------------------
# Remote Section — Phase 1 (IKE)
# ---------------------------------------------------------------------------
remote anonymous {
    exchange_mode main;
    generate_policy unique;
    certificate_type x509 "server.crt" "server.key";
    verify_cert on;
    my_identifier asn1dn;
    peers_identifier asn1dn;
    verify_identifier on;
    lifetime time 24 hour;
    proposal_check claim;
    nat_traversal on;
    dpd_delay 30;
    ike_frag on;

    # BSI TR-02102-3 compliant primary proposal (AES-256, SHA-256, DH 3072)
    proposal {
        encryption_algorithm aes 256;
        hash_algorithm sha256;
        authentication_method xauth_rsa_server;
        dh_group 15;
    }

    # Fallback for iOS clients that do not support DH group 15
    proposal {
        encryption_algorithm aes 256;
        hash_algorithm sha256;
        authentication_method xauth_rsa_server;
        dh_group 14;
    }
}

# ---------------------------------------------------------------------------
# Mode Config Section — IP/DNS allocation for roadwarrior clients
# ---------------------------------------------------------------------------
mode_cfg {
    # IP address pool (start address, pool size, netmask)
    network4 10.99.99.1;
    pool_size 200;
    netmask4 255.255.255.0;

    # Authentication source for XAuth user credentials.
    #
    # Options:
    #   system - /etc/passwd and /etc/shadow (simple, but requires local users)
    #   pam    - PAM stack (recommended: enables SSSD, LDAP, Kerberos, 2FA via
    #            PAM modules without racoon configuration changes)
    #   ldap   - Direct LDAP bind (see ldap_cfg section below; more complex,
    #            ties racoon to a specific LDAP server)
    #
    # SECURITY NOTE: 'system' authentication requires local user accounts on
    # the VPN gateway, which increases the attack surface and administrative
    # overhead.  For production deployments, 'pam' is strongly recommended:
    #
    #   auth_source pam;
    #
    # PAM allows integration with SSSD (Active Directory, FreeIPA), LDAP,
    # RADIUS (via pam_radius), TOTP/HOTP (pam_google_authenticator), smart
    # cards, and other authentication methods without modifying racoon.
    auth_source system;

    # DNS servers pushed to the client (via INTERNAL_DNS4_LIST env var)
    dns4 10.0.12.1;
    wins4 10.0.12.1;

    # Default DNS search domain pushed to the client
    default_domain "example.local";

    # Split DNS: domains that should be resolved via the VPN DNS server.
    # This is exported to the client as INTERNAL_SPLITDNS_DOMAINS and
    # consumed by phase1-up.sh to configure split-DNS search domains.
    split_dns "example.local";

    # Split network: destinations that should be tunneled to the VPN gateway.
    # Exported to the client as SPLIT_INCLUDE_CIDR and consumed by
    # phase1-up.sh to install split routes and per-network SPD policies.
    #
    # Use 'include' for a whitelist of destinations to tunnel.
    # Use 'local_lan' to exclude certain networks from the tunnel (tunnel
    #   everything except the listed networks).
    #
    # What to include here:
    #   - Internal corporate networks (e.g., 10.0.12.0/24 with DNS, file
    #     servers, application servers)
    #   - The IPsec VPN pool network itself (e.g., 10.99.99.0/24) if VPN
    #     clients should reach each other (site-to-site or client-to-client)
    #   - Other VPN networks (e.g., WireGuard 10.200.0.0/24) if running
    #     multiple VPN technologies in parallel on the gateway
    #
    # Example for multi-VPN operation (IPsec + WireGuard):
    #   split_network include 10.0.12.0/24, 10.99.99.0/24, 10.200.0.0/24;
    #
    # Example for client-to-client IPsec communication:
    #   split_network include 10.0.12.0/24, 10.99.99.0/24;
    split_network include 10.0.12.0/24;

    # Pre-connect banner displayed to the client
    banner "/etc/racoon/motd";

    # XAuth group restrictions (uncomment to require group membership).
    #
    # auth_groups specifies which LDAP groups are allowed to connect.
    # group_source ldap enables LDAP-based group validation (requires
    # auth_source ldap).  For PAM-based group checks, use PAM stack
    # configuration (e.g., pam_sss.so with SSSD) instead.
    # auth_groups "vpnuser";
    # group_source ldap;

    # Allow Cisco VPN client to save XAuth password
    save_passwd on;

    # Perfect Forward Secrecy for phase 2 (optional).
    #
    # BSI TR-02102-3 guidance: Phase 2 PFS may use weaker groups than Phase 1
    # to improve performance, since Phase 1 already established strong forward
    # secrecy.  Recommended: group 14 (modp2048) when Phase 1 uses group 15.
    #
    # If omitted: racoon accepts any PFS proposal from the client.  For
    # roadwarrior setups with generate_policy unique, this is often acceptable.
    # However, explicitly setting pfs_group ensures consistent security levels.
    #
    # IMPORTANT: If enabled here, the SAME pfs_group value MUST be present in
    # the sainfo section below, or Phase 2 negotiation will fail.
    # pfs_group 14;
}

# ---------------------------------------------------------------------------
# LDAP Config Section (only active when auth_source = ldap)
# ---------------------------------------------------------------------------
# mode_cfg LDAP-specific attributes (required when auth_source ldap):
#   attr_user   - LDAP attribute for username (default: cn)
#   attr_addr   - Attribute for client IP address assignment (mode_cfg)
#   attr_mask   - Attribute for client netmask (mode_cfg)
#   attr_member - Group membership attribute (for auth_groups validation)
#
# These mode_cfg attributes are separate from the group validation
# attributes.  attr_addr and attr_mask are only used when conf_source ldap.
ldap_cfg {
    host 10.0.12.3;
    port 389;
    base "dc=example,dc=local";
    subtree on;
    bind_dn "cn=VpnAdmin,dc=example,dc=local";
    bind_pw "************";
    attr_user "uid";
    attr_addr "CiscoIPAddress";
    attr_mask "CiscoIPNetmask";
    attr_member "uniqueMember";
}

# ---------------------------------------------------------------------------
# Sainfo Section — Phase 2 (IPsec) proposals
# ---------------------------------------------------------------------------
sainfo anonymous {
    # Perfect Forward Secrecy for phase 2 (optional, must match mode_cfg).
    #
    # IMPORTANT: If pfs_group is enabled in mode_cfg above, the SAME value
    # MUST be specified here, or Phase 2 negotiation will fail.
    #
    # BSI TR-02102-3: Phase 2 PFS may use weaker groups than Phase 1 for
    # performance, since Phase 1 already established strong forward secrecy.
    # Recommended: group 14 (modp2048) when Phase 1 uses group 15 (modp3072).
    # pfs_group 14;

    lifetime time 1 hour;
    encryption_algorithm aes 256;

    # HMAC authentication algorithms for ESP (Phase 2).
    #
    # CRITICAL INTEROPERABILITY NOTE:
    # hmac_sha256 has a known truncation bug in the Linux kernel's PF_KEY
    # interface (used by racoon on Linux).  The bug will never be fixed as
    # PF_KEY is deprecated in favor of XFRM/netlink.  When hmac_sha256 is
    # negotiated with non-Linux clients (Apple iOS/macOS, some Cisco IOS
    # versions), traffic appears to flow through the tunnel but is silently
    # dropped at the destination due to incorrect HMAC truncation.
    #
    # Symptoms: IKE negotiation succeeds, ping shows 0% packet loss in setkey
    # counters, but no application traffic reaches the destination.
    #
    # Safe defaults for cross-platform interoperability:
    #   - hmac_sha512: Strongest, widely supported
    #   - hmac_sha1: Weakest, but universally compatible (retain for legacy)
    #
    # For Linux-only deployments where PF_KEY behavior is acceptable, you
    # may uncomment hmac_sha256:
    #   authentication_algorithm hmac_sha512, hmac_sha256, hmac_sha1;
    #
    # For production roadwarrior gateways (recommended):
    authentication_algorithm hmac_sha512, hmac_sha1;
    compression_algorithm deflate;
}