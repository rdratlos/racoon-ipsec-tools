# racoon.conf - VPN Gateway (Roadwarrior Server)
#
# Modern configuration for a roadwarrior VPN gateway using racoon.
# Aligned with BSI TR-02102-3 cipher recommendations and the phase1-up.sh
# / phase1-down.sh helper scripts (split routes, split DNS, per-network SPD).
#
# Key design decisions:
#   - Main mode exchange (no aggressive mode) for full PFS and identity
#     protection during phase 1 negotiation.
#   - AES-256 / SHA-256 / DH group 15 (3072-bit) as primary proposal,
#     with DH group 14 (2048-bit) fallback for iOS clients.
#   - XAuth-RSA server-side authentication: client authenticates with
#     username/password signed by the server's RSA key pair.
#   - generate_policy unique: safe dynamic policy generation with monotonic
#     reqid, preventing policy pollution from concurrent clients.
#   - proposal_check claim: allows the client to propose shorter lifetimes
#     or smaller key lengths without rejecting the SA.
#   - Certificate and identity verification enforced (verify_cert,
#     verify_identifier) to prevent rogue-server attacks.
#   - split_network include and split_dns: fed to phase1-up.sh via the
#     SPLIT_INCLUDE_CIDR and INTERNAL_SPLITDNS_DOMAINS environment
#     variables for split-route and DNS configuration on the client side.
#   - PFS for phase 2 is commented out by default.  Uncomment pfs_group
#     in both mode_cfg and sainfo to enable it.  The phase 1 DH group
#     (15 = 3072-bit) must be >= the phase 2 PFS group.

# ---------------------------------------------------------------------------
# Path Specifications
# ---------------------------------------------------------------------------
path certificate "/etc/openssl/certs";

# ---------------------------------------------------------------------------
# Listen Section
# ---------------------------------------------------------------------------
listen {
    adminsock disabled;
}

# ---------------------------------------------------------------------------
# Timer Section
# ---------------------------------------------------------------------------
timer {
    natt_keepalive 15 seconds;
}

# ---------------------------------------------------------------------------
# Remote Section — Phase 1 (IKE)
# ---------------------------------------------------------------------------
remote anonymous {
    exchange_mode main;
    generate_policy unique;
    certificate_type x509 "server.crt" "server.key";
    verify_cert on;
    my_identifier asn1dn;
    peers_identifier asn1dn;
    verify_identifier on;
    lifetime time 24 hour;
    proposal_check claim;
    nat_traversal on;
    dpd_delay 30;
    ike_frag on;

    # BSI TR-02102-3 compliant primary proposal (AES-256, SHA-256, DH 3072)
    proposal {
        encryption_algorithm aes 256;
        hash_algorithm sha256;
        authentication_method xauth_rsa_server;
        dh_group 15;
    }

    # Fallback for iOS clients that do not support DH group 15
    proposal {
        encryption_algorithm aes 256;
        hash_algorithm sha256;
        authentication_method xauth_rsa_server;
        dh_group 14;
    }
}

# ---------------------------------------------------------------------------
# Mode Config Section — IP/DNS allocation for roadwarrior clients
# ---------------------------------------------------------------------------
mode_cfg {
    # IP address pool (start address, pool size, netmask)
    network4 10.99.99.1;
    pool_size 200;
    netmask4 255.255.255.0;

    # Authentication source: 'system' for /etc/passwd, 'ldap' for LDAP,
    # or 'pam' for PAM-based authentication.
    auth_source system;

    # DNS servers pushed to the client (via INTERNAL_DNS4_LIST env var)
    dns4 10.0.12.1;
    wins4 10.0.12.1;

    # Default DNS search domain pushed to the client
    default_domain "example.local";

    # Split DNS: domains that should be resolved via the VPN DNS server.
    # This is exported to the client as INTERNAL_SPLITDNS_DOMAINS and
    # consumed by phase1-up.sh to configure split-DNS search domains.
    split_dns "example.local";

    # Split network: only these destinations are tunneled.
    # Exported to the client as SPLIT_INCLUDE_CIDR and consumed by
    # phase1-up.sh to install split routes and per-network SPD policies.
    # Use 'include' for a whitelist of destinations to tunnel.
    # Use 'local_lan' to exclude certain networks from the tunnel.
    split_network include 10.0.12.0/24;

    # Pre-connect banner displayed to the client
    banner "/etc/racoon/motd";

    # XAuth group restrictions (uncomment to require group membership)
    # auth_groups "vpnuser";
    # group_source ldap;

    # Allow Cisco VPN client to save XAuth password
    save_passwd on;

    # Perfect Forward Secrecy for phase 2 (optional).
    # Uncomment to enable.  Requires a matching pfs_group in sainfo.
    # The phase 1 DH group (15 = 3072-bit) is sufficient for PFS group 14.
    # pfs_group 14;
}

# ---------------------------------------------------------------------------
# LDAP Config Section (only active when auth_source = ldap)
# ---------------------------------------------------------------------------
ldap_cfg {
    host 10.0.12.3;
    port 389;
    base "dc=example,dc=local";
    subtree on;
    bind_dn "cn=VpnAdmin,dc=example,dc=local";
    bind_pw "************";
    attr_user "uid";
    attr_addr "CiscoIPAddress";
    attr_mask "CiscoIPNetmask";
    attr_member "uniqueMember";
}

# ---------------------------------------------------------------------------
# Sainfo Section — Phase 2 (IPsec) proposals
# ---------------------------------------------------------------------------
sainfo anonymous {
    # Perfect Forward Secrecy for phase 2 (optional, must match mode_cfg).
    # Uncomment to enable PFS.  Group 14 (modp2048) is appropriate when
    # phase 1 uses DH group 15 (modp3072).
    # pfs_group 14;

    lifetime time 1 hour;
    encryption_algorithm aes 256;

    # HMAC authentication algorithms for ESP.  hmac_sha1 is retained for
    # backward compatibility with clients that do not support SHA-2.
    # hmac_sha256 does not interoperate with some Cisco IOS versions
    # (see GitHub issue #7).
    authentication_algorithm hmac_sha512, hmac_sha256, hmac_sha1;
    compression_algorithm deflate;
}