# Roadwarrior client, X.509 authentication, static internal networks.
#
# Unlike src/racoon/samples/roadwarrior/client (hybrid auth + mode_cfg,
# manually started via "racoonctl vc"), this setup targets a laptop that:
#   - authenticates purely with X.509 certificates (no XAuth/mode_cfg),
#   - reaches a fixed set of internal networks (no virtual/pool address),
#   - has a *dynamic* local address (WLAN/DHCP roaming) and a peer
#     reachable only via a Dynamic DNS hostname.
#
# racoon's "remote" address and setkey's tunnel-mode SPD endpoints both
# require numeric IP literals -- hostnames are rejected at parse time.
# The "remote" block is therefore kept in a separate, generated file
# (gateway.conf) that resolve-gateway.sh rewrites whenever the DynDNS
# name or the local address changes. See README.md for the full picture.

path certificate "/etc/racoon/certs";
path include      "/etc/racoon";

listen
{
    isakmp       0.0.0.0 [500];
    isakmp_natt  0.0.0.0 [4500];   # almost certainly behind NAT on WLAN
}

timer
{
    natt_keepalive  20 seconds;
}

# Generated/refreshed by resolve-gateway.sh -- contains the single
# "remote <literal-ip> { ... }" block for the VPN gateway.
include "gateway.conf";

# One sainfo block per internal network. Matching is by destination
# selector (not by peer identity), so make sure no other roadwarrior
# profile on the gateway (e.g. an iOS client using split_network for a
# *different* net) is ever offered these same three prefixes -- if it
# is, hmac_sha256 must NOT be used there (see the iOS HMAC-SHA256
# pitfall in the admin guide, section 7.5): iOS truncates ESP HMAC-SHA256
# per RFC 4868 (128 bit) while racoon expects 96 bit, so ESP packets get
# silently dropped. Between two racoon/Linux endpoints this pitfall does
# not apply, so hmac_sha256 is safe and preferred here.

sainfo address 0.0.0.0/0 any address 192.168.66.0/24 any
{
    pfs_group                  14;
    lifetime                   time 3600 seconds;
    encryption_algorithm       aes 256;
    authentication_algorithm   hmac_sha256;
    compression_algorithm      none;
}

sainfo address 0.0.0.0/0 any address 192.168.83.0/24 any
{
    pfs_group                  14;
    lifetime                   time 3600 seconds;
    encryption_algorithm       aes 256;
    authentication_algorithm   hmac_sha256;
    compression_algorithm      none;
}

sainfo address 0.0.0.0/0 any address 10.66.0.0/24 any
{
    pfs_group                  14;
    lifetime                   time 3600 seconds;
    encryption_algorithm       aes 256;
    authentication_algorithm   hmac_sha256;
    compression_algorithm      none;
}
