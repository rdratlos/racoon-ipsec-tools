# Roadwarrior client, X.509 + XAuth authentication, mode_cfg pool address.
#
# This targets a specific, real gateway configuration (not a generic
# guess): "remote anonymous" with authentication_method
# xauth_rsa_server, plus a "mode_cfg" block assigning each client a
# pool address (e.g. 192.168.66.x/24) and pushing DNS/domain. The
# gateway is tuned for iOS/macOS Cisco IPSec clients -- see the
# per-directive comments below for what that constrains us to.
#
# Unlike a pure site-to-site/static-subnet policy (this sample's
# earlier revision, and the admin guide's plain X.509/rsasig example),
# a mode_cfg client has NO fixed selector to pre-install a trap policy
# for: the pool address (e.g. 192.168.66.5) is assigned fresh at
# Phase 1 + Mode Config time, and we don't know it in advance. So the
# on-demand "kernel ACQUIRE from a stray trap policy" trick this
# sample used before is not available here -- instead, this laptop
# always *actively* initiates Phase 1 (+ Mode Config) itself, driven by
# resolve-gateway.sh, and the SPD for the three protected networks is
# built by phase1-up.sh once the pool address is actually known. See
# README.md for the full picture.

path certificate    "/etc/racoon/certs";
path pre_shared_key "/etc/racoon/psk.txt";   # XAuth password, keyed by xauth_login (see README)
path include         "/etc/racoon";

# Deliberately NO "listen" block here -- see the comment that used to
# be here for the reasoning (grabmyaddr.c: an explicit "isakmp 0.0.0.0
# [500];" binds racoon to the literal address 0.0.0.0, and its socket
# lookup for outgoing packets uses an exact memcmp with no wildcard
# case, so every negotiation fails with "send error"). Full account:
# see the Troubleshooting section in README.md.

timer
{
    natt_keepalive  15 seconds;   # matches the gateway's timer block
}

# Generated/refreshed by resolve-gateway.sh -- contains the single
# "remote <literal-ip> { ... }" block for the VPN gateway, including
# mode_cfg/xauth_login and the phase1-up/phase1-down script hooks.
include "gateway.conf";

# Mirrors the gateway's own "sainfo anonymous" exactly (see
# vpngateway.racoon.conf): aes 256, hmac_sha512 preferred with
# hmac_sha1 as fallback, deflate. Do NOT add hmac_sha256 -- the
# gateway's sainfo doesn't offer it at all (its own comment: "hmac_sha256
# does not interwork with iOS"), so proposing only sha256 here would
# make Quick Mode fail outright with NO-PROPOSAL-CHOSEN against this
# gateway, regardless of how well sha256 would work between two Linux
# endpoints in the abstract. Scoping by destination address (as this
# sample did before) is unnecessary now: the SPD entries phase1-up.sh
# installs already restrict which (src, dst) pairs are ever proposed,
# and matching the gateway's "anonymous" avoids any risk of a stricter
# per-network sainfo silently mismatching the pool address assigned at
# runtime.
sainfo anonymous
{
    lifetime                   time 3600 seconds;
    encryption_algorithm       aes 256;
    authentication_algorithm   hmac_sha512, hmac_sha1;
    compression_algorithm      deflate;
}
