# Expected whole-binary SKIPs (automake's exit-77 convention) for
# `make check-verbose`, by execution context.
#
# This is a structured manifest rather than a flat list because the two
# SKIP populations in this suite have different causes and different
# owners, and conflating them into one undifferentiated list (or splitting
# them into two separate ad-hoc files) would make it easy for either to
# silently grow or shrink without anyone noticing which one changed:
#
#   - unprivileged: binaries that always report SKIP under CI's normal,
#     unprivileged `make check-verbose` run. Checked automatically by
#     test/check-expected-skips.sh, wired into develop-build-test.yml.
#   - root: binaries that report SKIP only when *not* run as root (see
#     CONTRIBUTING.md's "Running the Test Suite" section). Not checked by
#     CI today -- CI never runs as root, by design -- but recorded here
#     for a future `sudo make check` consumer, so that path never needs
#     its own separate baseline file either.
#
# A binary listed under `unprivileged` is expected to SKIP on every
# ordinary CI run, regardless of who added it or why -- see the `reason`
# field per entry for specifics. Any new, missing, or unexpected SKIP
# outside this list fails the check; see CONTRIBUTING.md's "Two tests
# skip under whole-program LTO" section for what that means.

unprivileged:
  - binary: test_admin_establish_sa_psk
    reason: >-
      -Wl,--wrap=vfree canary defeated by whole-program LTO
      (-flto=auto -ffat-lto-objects) -- see doc/dev/wrap-based-tests-vs-lto.md
  - binary: test_getcertsbyname_helpers
    reason: >-
      -Wl,--wrap=free canary defeated by whole-program LTO
      (-flto=auto -ffat-lto-objects) -- see doc/dev/wrap-based-tests-vs-lto.md

root:
  - binary: test_privsep_client_wrappers
    reason: needs real root (CAP_SETUID) for privsep.c's client-side wrapper wire protocol
  - binary: test_privsep_hybrid_client_wrappers
    reason: needs real root (CAP_SETUID) for privsep.c's client-side wrapper wire protocol
