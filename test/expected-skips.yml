# Expected whole-binary SKIPs (automake's exit-77 convention) for
# `make check-verbose`, by why the SKIP happens rather than by a single
# flat list -- because this suite has two SKIP populations with genuinely
# different reliability, and conflating them (or splitting into two
# separate ad-hoc files) makes it easy for either to silently drift
# without anyone noticing which one changed:
#
#   - always_skip_unprivileged: binaries that deterministically report
#     SKIP on every ordinary (non-root) `make check-verbose` run,
#     regardless of toolchain -- CI runs unprivileged by design (see
#     CONTRIBUTING.md's "Why some tests need root"), so these are a hard
#     "must be exactly SKIP" check.
#   - lto_canary: binaries whose SKIP is toolchain-dependent, not
#     guaranteed by the presence of -flto=auto -ffat-lto-objects alone.
#     Observed to reproduce on GCC 15.2/ld 2.46 (Ubuntu 26.04
#     "Resolute"); NOT observed on GitHub's hosted `ubuntu-latest`
#     runner (Ubuntu 24.04 "Noble" as of this writing) with the same
#     flags -- confirmed empirically (both binaries PASS there, not
#     SKIP). So this is a softer check: PASS is the expected outcome on
#     CI's actual runner today, SKIP-with-the-documented-message is also
#     fine (and means the defeat triggered, e.g. after a runner image
#     upgrade), and only a genuine FAIL or a SKIP with an unexplained
#     message is a problem. See doc/dev/v0.9.1-hardening-spec.md §3.2 and
#     CONTRIBUTING.md's "Two tests skip under whole-program LTO".
#   - root (currently empty): binaries that would report SKIP only when
#     run AS root -- none exist in this suite today (the root-dependent
#     tests skip when run *without* root, the opposite condition, so
#     they're under always_skip_unprivileged above). Kept as a place to
#     record any if a future `sudo make check` consumer needs one, so
#     that path never needs its own separate baseline file either.

always_skip_unprivileged:
  - binary: test_privsep_client_wrappers
    reason: needs real root (CAP_SETUID) for privsep.c's client-side wrapper wire protocol
  - binary: test_privsep_hybrid_client_wrappers
    reason: needs real root (CAP_SETUID) for privsep.c's client-side wrapper wire protocol

lto_canary:
  - binary: test_admin_establish_sa_psk
    reason: >-
      -Wl,--wrap=vfree canary, defeated by whole-program LTO on some
      toolchains -- see doc/dev/v0.9.1-hardening-spec.md §3.2
    skip_message_substring: "did not intercept a canary vfree"
  - binary: test_getcertsbyname_helpers
    reason: >-
      -Wl,--wrap=free canary, defeated by whole-program LTO on some
      toolchains -- see doc/dev/v0.9.1-hardening-spec.md §3.2
    skip_message_substring: "did not intercept free"

root: []
