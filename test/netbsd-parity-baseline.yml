# Baseline of check_PROGRAMS binaries a "full" NetBSD CI run --
# SANITIZER_BUILD=no, real root (`sudo make check`) -- must actually
# build and, for the root-gated ones, actually PASS (not SKIP).
#
# Introduced after the 2026-08-05 NetBSD regression investigation; see
# doc/dev/v0.9.1-hardening-spec.md §11 for the full story. Consumed by
# check-netbsd-parity.sh, run from develop-netbsd-full-check.yml.
#
# must_build: every check_PROGRAMS binary gated by a bare
#   `if !SANITIZER_BUILD` block in test/Makefile.am -- i.e. dropped from
#   check_PROGRAMS *entirely* whenever SANITIZER_BUILD=yes, which is
#   exactly the condition develop-netbsd-build-test.yml's sanitizer-by-
#   default design satisfies on every ordinary push/PR. Seeded from a
#   full conditional-stack parse of test/Makefile.am (§11.3.1) and
#   re-verified against develop-netbsd-full-check.yml's own first live
#   runs on real NetBSD 10 (§11.6) -- 33 binaries matched that condition,
#   all 33 confirmed present in the real `make check TESTS=` binary list
#   on NetBSD, so all 33 are tracked here.
#
#   Two binaries matched the same `!SANITIZER_BUILD` condition but are
#   platform-excluded on NetBSD for an unrelated reason, confirmed absent
#   from that same real build, and are correctly never candidates for
#   this list: test_grabmyaddr_netlink (HAVE_LINUX_NETLINK, Linux-only)
#   and test_privsep_socket_policy (HAVE_PF_PACKET, a Linux-only socket
#   family -- see its own file header). An earlier version of this file
#   also excluded test_nattraversal_natd on the theory that
#   this project's NetBSD configure reports ENABLE_NATT=no; that theory
#   was never actually checked against real NetBSD and turned out to be
#   wrong -- `--enable-natt`'s default is `auto` (configure.ac), and
#   NetBSD 10's kernel NAT-T probe succeeds, so ENABLE_NATT=yes there and
#   test_nattraversal_natd builds like every other binary in this list
#   (confirmed present in both of develop-netbsd-full-check.yml's first
#   live NetBSD runs, §11.6).
#
#   test_handler_flushph1 was added later (flushph1() use-after-free fix,
#   reported via valgrind on a real roadwarrior client) and matches the
#   same `!SANITIZER_BUILD` condition as the rest of this list. It has
#   only been confirmed here in this sandbox (build + check + check-
#   valgrind, all clean) -- not yet against a real NetBSD run the way
#   the original 33 were -- but is tracked here on the same basis: it
#   uses the identical -ffunction-sections/--gc-sections isolation
#   technique as test_algorithm/test_admin_handler, both of which are
#   already NetBSD-confirmed in this list.
#
#   A binary appearing in test/ that is NOT in this list is not an
#   error -- check-netbsd-parity.sh only warns about it (new coverage
#   should never be penalized). A binary in this list NOT appearing in
#   test/ IS an error: it means something just silently re-created the
#   exact class of gap this file exists to catch.
#
# must_pass_as_root: the subset whose root-gated assertions
#   (CONTRIBUTING.md's "Why some tests need root") only run for real
#   under genuine root. test/expected-skips.yml's own `root: []` section
#   documents that no CI job has ever exercised this path before
#   develop-netbsd-full-check.yml; these three must report PASS (exit 0)
#   here specifically -- the opposite of expected-skips.yml's
#   always-SKIP-unprivileged list, which still applies to any other CI
#   job that runs this suite unprivileged.

must_build:
  - test_admin2pfkey_proto
  - test_admin_check_sockpath
  - test_admin_close
  - test_admin_delete_all_sa_dst
  - test_admin_establish_sa_psk
  - test_admin_handler
  - test_admin_init
  - test_admin_mkdir_p
  - test_admin_process_dispatch
  - test_algorithm
  - test_getcertsbyname_dnssec
  - test_getcertsbyname_helpers
  - test_handler_flushph1
  - test_ipsec_doi_sa
  - test_kmpstat_com_recv
  - test_monitor_fd_cold_start
  - test_monitor_fd_range
  - test_nattraversal_natd
  - test_privsep_init
  - test_privsep_init_fork_failure
  - test_proposal_authtype_log
  - test_prune_stale_monitored_fds
  - test_racoonctl_encode_requests
  - test_racoonctl_exchangesa
  - test_racoonctl_format_output
  - test_racoonctl_get_comindex
  - test_racoonctl_get_comindexes
  - test_racoonctl_logoutusr
  - test_script_exec_wait
  - test_script_hook_leak
  - test_session_check_sigreq
  - test_session_init_before_cfparse
  - test_session_wait_and_dispatch
  - test_vendorid_bounds

must_pass_as_root:
  - test_privsep_client_wrappers
  - test_privsep_hybrid_client_wrappers
  - test_privsep_init
